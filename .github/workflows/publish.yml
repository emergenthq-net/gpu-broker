name: publish

# PyPI Trusted Publishing (OIDC): no long-lived PyPI token is stored in GitHub.
# PyPI publisher identity:
#   project: gpu-broker
#   owner: emergenthq-net
#   repository: gpu-broker
#   workflow: publish.yml
#   environment: pypi

on:
  release:
    types: [published]
  push:
    paths:
      - ".github/PUBLISH_V0_2_0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || 'v0.2.0' }}
  cancel-in-progress: false

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag || 'v0.2.0' }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z" >&2; exit 2 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          test "$VERSION" = "$PACKAGE_VERSION" || {
            echo "tag $TAG does not match pyproject version $PACKAGE_VERSION" >&2
            exit 3
          }

      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.release.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ github.event.release.tag_name || inputs.tag || 'v0.2.0' }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
