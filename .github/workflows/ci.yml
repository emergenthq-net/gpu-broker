name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes no floating major tag
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Ruff (incl. PLR2004 magic numbers, bandit security rules)
        run: .venv/bin/ruff check .
      - name: Mypy (strict)
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest -q tests
      - name: JS syntax
        run: for f in gpu_broker/web/static/*.js; do node --check "$f"; done
      - name: Package builds with its dashboard assets and demo catalog
        run: |
          uv build --wheel --out-dir dist
          test "$(python3 -m zipfile -l dist/*.whl | grep -cE 'gpu_broker/web/static/(dash\.html|dash\.js|live\.js|index\.js|imagejob\.js|connect\.js|upstreams\.js) ')" = 7
          python3 -m zipfile -l dist/*.whl | grep -q 'gpu_broker/demo/catalog.yaml '   # `gpu-broker demo` needs it
      - name: Installed wheel imports every module and runs the demo's entry point
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"   # not the checkout: import the installed package, not the source tree
          # Without extras: everything but the MCP server's SDK modules imports, and `gpu-broker mcp` says what to install.
          wheel/bin/python -c "import importlib, pkgutil, gpu_broker; [importlib.import_module(m.name) for m in pkgutil.walk_packages(gpu_broker.__path__, 'gpu_broker.') if not m.name.endswith('__main__') and not m.name.startswith('gpu_broker.mcp_server.')]"
          wheel/bin/gpu-broker demo --help
          if wheel/bin/gpu-broker mcp 2> mcp.err; then exit 1; fi
          grep -q "gpu-broker\[mcp\]" mcp.err
          # With the mcp extra: every module.
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[mcp]"
          wheel/bin/python -c "import importlib, pkgutil, gpu_broker; [importlib.import_module(m.name) for m in pkgutil.walk_packages(gpu_broker.__path__, 'gpu_broker.') if not m.name.endswith('__main__')]"
      - name: The sdist is self-testing (unpack, install, run the suite)
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/sdist"
          mkdir "$RUNNER_TEMP/unpacked" && tar xzf "$RUNNER_TEMP"/sdist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"/unpacked/gpu_broker-*/
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python "$(ls "$RUNNER_TEMP"/sdist/*.tar.gz)[dev]"
          .venv/bin/pytest -q -p no:cacheprovider tests

  leak-scan:
    # The tree, sdist and wheel must match nothing on the private denylist. The list lives in
    # the Actions secret LEAK_DENYLIST, never in this repository; hits print file, line and
    # entry number only. Pull requests from forks get no secrets and skip with a notice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Denylist from the LEAK_DENYLIST secret
        id: denylist
        env:
          DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
            echo "file=$RUNNER_TEMP/denylist" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = true ]; then
            echo "::notice::pull request from a fork: no secrets, so the leak scan is left to the maintainers' run"
          else
            echo "::error::the LEAK_DENYLIST secret is not set; refusing to pass without it"; exit 1
          fi
      - name: Scan the tree, sdist and wheel
        if: steps.denylist.outputs.file
        run: |
          uv build -q --sdist --wheel --out-dir "$RUNNER_TEMP/dist"
          python3 scripts/leak_scan.py --denylist "${{ steps.denylist.outputs.file }}" . "$RUNNER_TEMP"/dist/*
      - name: The demo matches nothing on the denylist
        if: steps.denylist.outputs.file
        env:
          GPU_BROKER_LEAK_DENYLIST: ${{ steps.denylist.outputs.file }}
        run: |
          uv venv -q --python 3.12 .venv
          uv pip install -q --python .venv/bin/python -e '.[dev]'
          .venv/bin/pytest -q tests/test_demo_sim.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t gpu-broker:ci .
      - name: Image loads the example config and catalog
        run: |
          docker run --rm -v "$PWD/examples:/etc/gpu-broker:ro" \
            -e BROKER_CONFIG=/etc/gpu-broker/docker/config.yaml -e BROKER_CATALOG=/etc/gpu-broker/catalog.yaml \
            --entrypoint gpu-broker gpu-broker:ci check
