name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes no floating major tag
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Ruff (incl. PLR2004 magic numbers, bandit security rules)
        run: .venv/bin/ruff check .
      - name: Mypy (strict)
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest -q tests
      - name: JS syntax
        run: for f in gpu_broker/web/static/*.js; do node --check "$f"; done
      - name: Package builds with its dashboard assets and demo catalog
        run: |
          uv build --wheel --out-dir dist
          test "$(python3 -m zipfile -l dist/*.whl | grep -cE 'gpu_broker/web/static/(dash\.html|dash\.js|live\.js|index\.js|imagejob\.js) ')" = 5
          python3 -m zipfile -l dist/*.whl | grep -q 'gpu_broker/demo/catalog.yaml '   # `gpu-broker demo` needs it
      - name: Installed wheel imports every module and runs the demo's entry point
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"   # not the checkout: import the installed package, not the source tree
          wheel/bin/python -c "import importlib, pkgutil, gpu_broker; [importlib.import_module(m.name) for m in pkgutil.walk_packages(gpu_broker.__path__, 'gpu_broker.') if not m.name.endswith('__main__')]"
          wheel/bin/gpu-broker demo --help

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t gpu-broker:ci .
      - name: Image loads the example config and catalog
        run: |
          docker run --rm -v "$PWD/examples:/etc/gpu-broker:ro" \
            -e BROKER_CONFIG=/etc/gpu-broker/docker/config.yaml -e BROKER_CATALOG=/etc/gpu-broker/catalog.yaml \
            --entrypoint gpu-broker gpu-broker:ci check
