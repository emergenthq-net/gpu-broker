# gpu-broker config — systemd driver (the broker and the model servers run on this machine).
# Install as /etc/gpu-broker/config.yaml, or point BROKER_CONFIG at it.
# Secrets never go here: BROKER_TOKEN (API bearer token) and UPSTREAM_TOKEN_* (model server
# API keys, referenced by a catalog entry's auth_env) come from the environment.
catalog: /etc/gpu-broker/catalog.yaml
db: /var/lib/gpu-broker/broker.db
events_jsonl: /var/log/gpu-broker/events.jsonl
gpu_stream: true          # sample the GPU for the dashboard's live charts

server:
  host: 127.0.0.1         # bind address; expose deliberately, behind TLS (see SECURITY.md)
  port: 8095
  graceful_shutdown_s: 10   # max wait for open connections on stop; keep systemd TimeoutStopSec above it

comfy:
  url: http://127.0.0.1:8188     # as the broker reaches ComfyUI
  public_url: null               # as browsers reach it (dashboard links, job output URLs); default = url
  unit: comfyui                  # started if ComfyUI is found down; null = never start it
  auth_env: ""                   # ComfyUI behind auth: an UPSTREAM_TOKEN_* env var holding its Bearer token

driver:
  kind: systemd
  sudo: false                    # true: run `sudo -n systemctl ...` (add a narrow sudoers rule)
  user: false                    # true: `systemctl --user` units
  models_root: /var/lib/gpu-broker/models    # downloads land in <models_root>/<slug>
  comfy_models_dir: /opt/ComfyUI/models      # where `link` exposes downloaded files to ComfyUI
  # allowed_units: [llama-server, comfyui]   # default: every unit named in the catalog + comfy.unit

timeouts:                 # seconds; every key and its default: gpu_broker/settings.py
  chat_wait_s: 570        # /v1/chat/completions: queue + switch + run
  llm_start_s: 240        # an LLM server must pass its health check within this
intervals:
  gpu_sample_s: 2         # local GPU sampler period
scheduler:
  policy: fair            # interactive first, then the lightest requester; `fifo` = arrival order (rollback)
  max_wait_s: 3600        # a background job waiting this long counts as interactive
  evict_wait_s: 600       # a call waiting for a slot holds off a switch at most this long
  # may_claim_interactive: [alice, webui]   # who may raise its class; default: anyone not background

inputs:                   # input files for image-to-video, image-edit and exec jobs
  max_bytes: 20971520     # per image, decoded
  video_max_bytes: 104857600
  max_frames: 64          # images in one `frames` list
  types: [png, jpeg, webp]
  video_types: [mp4, mov, webm]
  allow_urls: false       # true lets callers send <slot>_url: the broker then fetches public http(s) URLs
  url_allow_networks: []  # CIDRs <slot>_url may reach besides public addresses and comfy.url, e.g. [192.168.1.0/24]
  staging_dir: /var/lib/gpu-broker/inputs

mcp:                      # the MCP server at /mcp; needs `pip install 'gpu-broker[mcp]'` (else not served)
  enabled: true
  wait_s: 45              # a generate tool waits this long, then returns the job id to poll
  inline_max_bytes: 1048576   # finished images this small also come back inline
  inline_max_images: 4
  max_body_bytes: 67108864    # one /mcp request (base64 inputs); larger files go by URL
  client_url_inputs: false    # let client keys send <slot>_url inputs (the broker fetches them); the main token always may

ui:
  gpu_label: NVIDIA GPU               # dashboard GPU card title
  resident_label: the default model   # who holds the GPU when nothing else is running
  power_max_w: 450                    # chart scales
  temp_max_c: 90
  groups:                             # VRAM-by-owner legend; ids are systemd unit names here
    llama-server: {label: llama.cpp, color: "#3b5bdb"}
    comfyui: {label: ComfyUI, color: "#e8590c"}

# Drop-in replacement for hosted APIs (docs/drop-in.md). With no model_map here, hosted chat
# names map to the resident LLM: gpt-*, chatgpt-*, o1/o3/o4..., claude-*. Set one to change
# that (first match wins, case-insensitive; "@default" = the resident LLM; names the catalog
# knows are never mapped), or `model_map: {}` to turn mapping off.
# Env override: BROKER_MODEL_MAP='{"gpt-*": "@default"}' (JSON).
# model_map:
#   "gpt-4o-mini": llama-3.1-8b-precise   # a specific name first, before its general pattern
#   "gpt-*": "@default"
#   "claude-*": "@default"
#   "text-embedding-*": my-embedder       # a catalog model with caps: [embed]

# Optional hosted fallback, off by default: when the local side cannot serve a hosted model
# name (GPU busy with another model, a failed call, a hosted-only feature), forward it to the
# real provider with YOUR key, read from the env var named here (never from this file, never
# logged). Every response says which side answered (header x-broker-served-by).
fallback:
  enabled: false                          # or BROKER_FALLBACK=1
  openai_key_env: UPSTREAM_OPENAI_API_KEY
  anthropic_key_env: UPSTREAM_ANTHROPIC_API_KEY
  when_switching: true                    # also when the call would wait for a model switch

# Optional cloud-first failover (docs/failover.md), off by default: routed names go to the real
# provider first, with the client's own key passed through, and to the local model at the end
# of the chain when the provider fails (no internet, outage, 5xx/529, quota or credit used up).
# upstreams:
#   providers:
#     anthropic: {url: https://api.anthropic.com, api: anthropic}
#     openai:    {url: https://api.openai.com, api: openai}   # key_env: UPSTREAM_OPENAI_API_KEY (optional)
#     # Only official hosts get a client's own key (pass_client_key); others use their key_env:
#     openrouter: {url: https://openrouter.ai/api, api: openai, key_env: UPSTREAM_OPENROUTER_API_KEY}
#   routes:
#     "claude-*": [anthropic, llama-3.1-8b]
#     "gpt-*":    [openai, llama-3.1-8b]
