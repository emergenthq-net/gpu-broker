# gpu-broker config — Proxmox driver. The broker runs in its own LXC/VM; model servers are
# systemd units inside other containers. See README "Security model" and host/gpu-broker-ctl.
catalog: /etc/gpu-broker/catalog.yaml     # units written as {name: llama-server, target: 101}
comfy:
  url: http://192.0.2.102:8188
  unit: {name: comfyui, target: 102}
driver:
  kind: proxmox
  ssh_target: root@192.0.2.1              # the Proxmox host
  ssh_key: /etc/gpu-broker/id_ed25519     # restricted to gpu-broker-ctl by authorized_keys command=
ui:
  groups:                                 # ids are container ids (from the host's cgroups)
    "101": {label: LLM (container 101)}
    "102": {label: ComfyUI (container 102)}
